name: SEO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes to the repository; without this block the workflow
# inherits the repository default, which may be read/write.
permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue tidy.
concurrency:
  group: seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-and-sitemap:
    name: Meta + sitemap + robots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@v6
        with:
          # Same source as ci.yml, so a Node bump lands in one place.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Nuxt dev server
        run: pnpm dev > nuxt-dev.log 2>&1 &
        env:
          # Skip analytics network calls when running headless.
          NUXT_PUBLIC_POSTHOG_DISABLED: 'true'

      - name: Wait for server
        run: pnpm exec wait-on http://localhost:3000 --timeout 240000 --interval 2000

      - name: Run SEO meta checks
        run: pnpm seo:check -- --base http://localhost:3000

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-dev-log
          path: nuxt-dev.log
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse SEO score
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@v6
        with:
          # Same source as ci.yml, so a Node bump lands in one place.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Nuxt dev server
        run: pnpm dev > nuxt-dev.log 2>&1 &
        env:
          NUXT_PUBLIC_POSTHOG_DISABLED: 'true'

      - name: Wait for server
        run: pnpm exec wait-on http://localhost:3000 --timeout 240000 --interval 2000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-dev-log-lh
          path: nuxt-dev.log
          if-no-files-found: ignore
