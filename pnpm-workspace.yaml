onlyBuiltDependencies:
  - '@intlify/vue-i18n-bridge'
  - '@intlify/vue-router-bridge'
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - vue-demi

overrides:
  '@eslint/plugin-kit@<0.3.4': '>=0.3.4'
  '@intlify/core-base@>=10.0.0 <10.0.8': '>=10.0.8'
  '@intlify/core@>=10.0.0 <10.0.8': '>=10.0.8'
  '@nuxt/devtools@<2.6.4': '>=2.6.4'
  '@nuxtjs/mdc@<0.17.2': '>=0.17.2'
  axios@>=1.0.0 <1.12.0: '>=1.12.0'
  brace-expansion@>=2.0.0 <=2.0.1: '>=2.0.2'
  form-data@>=4.0.0 <4.0.4: '>=4.0.4'
  ipx@>=2.0.0-0 <2.1.1: '>=2.1.1'
  koa@>=2.0.0 <2.16.2: '>=2.16.2'
  nuxt@>=3.6.0 <3.19.0: '>=3.19.0'
  posthog-node: '^5.8.4'
  tar-fs@>=2.0.0 <2.1.4: '>=2.1.4'
  tar-fs@>=3.0.0 <3.1.1: '>=3.1.1'
  # Supersedes the former '>=7.1.0 <=7.1.4: >=7.1.5' rule: same lower bound,
  # wider upper bound, higher floor. Two overlapping rules for one package
  # leave it undefined which floor applies.
  vite@>=7.1.0 <=7.1.10: '>=7.1.11'
  vue-i18n@>=10.0.0 <10.0.8: '>=10.0.8'
# nuxt-schema-org 6.3.2's i18n plugin passes a computed() to defineWebPage(),
# which loses the resolver metadata and adds an untyped WebPage node to every
# page's JSON-LD. Fixed upstream on main (harlan-zw/nuxt-schema-org#155), not
# yet released. Delete this entry and the patch file with the first release
# after 6.3.2 — pnpm fails the install loudly if the patch no longer applies.
patchedDependencies:
  nuxt-schema-org@6.3.2: patches/nuxt-schema-org@6.3.2.patch
