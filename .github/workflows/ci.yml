name: CI

on:
  # Deliberately not filtered to `branches: [main]`. A stacked pull request
  # targets the branch below it rather than main, and a base filter would skip
  # CI on it entirely — the change would reach main unverified once the stack
  # collapses. Running on every pull request costs a few extra minutes and
  # keeps every link in a stack gated.
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The only gate that runs against the $production config branch. Every
      # other check in this repository measures the dev server, which leaves
      # the whole `$production` block in nuxt.config.ts unexercised.
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      # Serves the build in workerd, where one isolate handles many requests
      # at once — the condition every other check here, all sequential, never
      # creates. This catches per-request state leaking into module scope. It
      # cannot catch CPU-limit aborts: wrangler dev enforces no CPU limit, so
      # those are verified against production after a deploy (see AGENTS.md).
      - name: Start production preview
        run: pnpm preview:prod > wrangler-preview.log 2>&1 &

      - name: Wait for preview
        run: pnpm exec wait-on http-get://localhost:8787/robots.txt --timeout 120000 --interval 2000

      - name: Concurrency check
        run: node scripts/concurrency-check.mjs --base http://localhost:8787

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-preview-log
          path: wrangler-preview.log
          if-no-files-found: ignore

  quality:
    name: Lint + typecheck (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compares ESLint and TypeScript error counts against
      # quality-baseline.json and fails only when a count RISES. The repository
      # carries a backlog that accumulated while nothing measured it; blocking
      # on the absolute number would stall every pull request. See
      # scripts/quality-gate.mjs.
      - name: Quality ratchet
        run: pnpm quality

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unlike the ratchet, this is a hard gate: the suite is green today and
      # must stay green. Guard tests assert rules that neither the compiler nor
      # ESLint can see — a Tailwind class naming a token that does not exist is
      # not a syntax error, it just renders nothing.
      - name: Run tests
        run: pnpm test

  cross-browser:
    name: Colour roles across browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every MD3 colour role is a light-dark() pair and an opacity modifier
      # wraps it in color-mix(). Whether an engine resolves that per colour
      # scheme — and whether the state layer stays invisible at rest instead
      # of falling back to a solid fill — is a rendering question no unit test
      # answers. Rendered pixels, in all three engines, light and dark.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Check colour roles
        run: pnpm check:colors
