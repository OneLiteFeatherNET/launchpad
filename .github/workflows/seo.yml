name: SEO

on:
  # Not filtered to main, for the same reason as ci.yml: a stacked pull
  # request targets the branch below it and would otherwise reach main
  # without these gates ever running on it.
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository; without this block the workflow
# inherits the repository default, which may be read/write.
permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue tidy.
concurrency:
  group: seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-and-sitemap:
    name: Meta + sitemap + robots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          # Same source as ci.yml, so a Node bump lands in one place.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The production build, served in workerd. The dev server this used to
      # measure never exercises the `$production` config branch, the route
      # rules' headers or the server plugins — the very things these gates
      # are about.
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Start production preview
        run: pnpm preview:prod > wrangler-preview.log 2>&1 &

      - name: Wait for server
        run: pnpm exec wait-on http-get://localhost:8787/robots.txt --timeout 120000 --interval 2000

      - name: Run SEO meta checks
        run: pnpm seo:check -- --base http://localhost:8787 --no-mock

      - name: Run cache header checks
        run: node scripts/cache-check.mjs --base http://localhost:8787

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-preview-log
          path: wrangler-preview.log
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse SEO score
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          # Same source as ci.yml, so a Node bump lands in one place.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Start production preview
        run: pnpm preview:prod > wrangler-preview.log 2>&1 &

      - name: Wait for server
        run: pnpm exec wait-on http-get://localhost:8787/robots.txt --timeout 120000 --interval 2000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-preview-log-lh
          path: wrangler-preview.log
          if-no-files-found: ignore
